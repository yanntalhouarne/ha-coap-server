# Enable asserts
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y

# Debug-friendly build: -Og and thread info for the debugger.
# -Og does not fit in the application slot together with overlay-logging.conf.
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y

# Back to newlib-nano (about 13 KB smaller): the full newlib that RAM power-down
# needs doesn't fit with -Og. Power use doesn't matter in a debug build.
CONFIG_RAM_POWER_ADJUST_ON_HEAP_RESIZE=n
CONFIG_NEWLIB_LIBC_NANO=y
