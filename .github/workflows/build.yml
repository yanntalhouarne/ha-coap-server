# Builds every firmware variant from a clean clone, with the same scripts as a new PC.
name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The toolchain (~/ncs/toolchains), the nrfutil commands (~/.nrfutil) and the SDK
      # (external/) only change with the setup script or the SDK pin.
      - name: Cache toolchain and SDK
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin/nrfutil
            ~/.nrfutil
            ~/ncs/toolchains
            external
          key: ncs-${{ runner.os }}-${{ hashFiles('application/west.yml', 'scripts/setup.sh') }}

      - name: Set up toolchain and SDK
        run: scripts/setup.sh

      - name: Build battery (production)
        run: scripts/build.sh battery

      - name: Build usb-logging
        run: scripts/build.sh usb-logging

      - name: Build uart-console
        run: scripts/build.sh uart-console

      - name: Build debug
        run: scripts/build.sh debug

      # CI has no private signing key, so these images are signed with MCUboot's public
      # development key: boards whose bootloader has a private key reject them.
      - name: Upload the production firmware (development key)
        uses: actions/upload-artifact@v7
        with:
          name: hacoap-firmware-devkey-${{ github.sha }}
          path: |
            application/build/zephyr/app_update.bin
            application/build/zephyr/merged.hex

  # Unit tests of the firmware's logic, compiled for the PC with fake Zephyr and OpenThread
  # APIs. Windows uses Zig's C compiler, as a PC without one would.
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Run the unit tests (with sanitizers)
        if: runner.os != 'Windows'
        run: python3 application/tests/unit/run.py --sanitize

      - name: Run the unit tests (Zig's C compiler)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet ziglang
          CC="python -m ziglang cc" python application/tests/unit/run.py

  # The update scripts on each OS users run them on, with a fake mcumgr. macOS runs them
  # with its own /bin/bash 3.2, Windows with Git Bash.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Test the update scripts
        run: /bin/bash scripts/tests/test-scripts.sh

      # The optional packages change how devices and serial ports are found
      - name: Run the helper with zeroconf and pyserial
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" || python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --quiet zeroconf pyserial
          "$py" scripts/hacoap_tools.py discover --timeout 2
          "$py" scripts/hacoap_tools.py serial-ports

  # The web updater: pages, API and a full update through the script with a fake mcumgr,
  # plus a JavaScript syntax check of every page (Node.js is preinstalled on the runners).
  web-updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: firmware-updater
    steps:
      - uses: actions/checkout@v7

      - name: Install the requirements
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" || python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --quiet -r requirements.txt
          echo "PY=$py" >> "$GITHUB_ENV"

      - name: Test the web updater
        run: |
          node --version
          "$PY" tests/test_web_updater.py
